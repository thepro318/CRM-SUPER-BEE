<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Super BDC | Sales Command Center</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e8effa;background:#0d1421}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:#9ac8ff}.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}.side{background:#111e30;border-right:1px solid #2d3b52;padding:24px 16px}.logo{font-weight:850;font-size:25px;letter-spacing:1px;margin:4px 12px 28px}.logo span{color:#67b6ff}.nav{display:grid;gap:6px}.nav button{color:#afc1da;background:transparent;border:0;text-align:left;padding:13px 14px;border-radius:11px}.nav button.active,.nav button:hover{color:#fff;background:#273d5e}.main{padding:28px;max-width:1550px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:24px}.head h1{margin:0;font-size:26px}.muted{color:#96a8c2}.small{font-size:12px}.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:6px 10px;background:#284060;color:#bde0ff}.safe{background:#153b35;color:#85e2b8}.warn{background:#45321e;color:#ffd297}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(130px,1fr))}.card{background:#18263b;border:1px solid #2e3e57;border-radius:16px;padding:19px}.stat strong{display:block;font-size:30px;margin-top:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.field{background:#0f1929;color:#eaf1fc;border:1px solid #40516c;border-radius:10px;padding:11px;min-width:0}.btn{background:#397adc;color:white;border:0;padding:11px 15px;border-radius:10px;font-weight:650}.btn.secondary{background:#293b54}.btn.danger{background:#713b46}.split{display:grid;grid-template-columns:minmax(260px,1fr) minmax(330px,1.2fr);gap:16px}.list{display:grid;gap:8px}.lead{display:flex;align-items:center;justify-content:space-between;text-align:left;gap:14px;border:1px solid #30415c;background:#1b2c44;border-radius:10px;padding:13px;width:100%;color:#f3f7ff}.lead.selected{border-color:#70aefa;background:#254467}.lead:hover{background:#28415f}.history{height:310px;overflow:auto;background:#101b2c;padding:14px;border-radius:12px;display:flex;flex-direction:column;gap:12px}.bubble{padding:10px 13px;border-radius:12px;max-width:88%;background:#34455f;align-self:flex-start}.bubble.out{background:#21497a;align-self:flex-end}.bubble i{display:block;color:#b6c7dc;font-size:11px;margin-bottom:4px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.hide{display:none!important}.section-title{margin:0 0 16px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{border:1px solid #40536e;color:#c7d5e9;background:#142137;border-radius:9px;padding:8px 12px}.tabs button.active{border-color:#69a8f9;background:#2a486b}.note{border-left:3px solid #7ab7ff;padding:9px 13px;background:#13273e;color:#c7d8f1;border-radius:5px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #33445e}.table th{color:#a9bbd3;font-size:12px}.check{display:flex;gap:10px;align-items:center}.empty{padding:30px;text-align:center;color:#9eb1cb}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}textarea{width:100%;min-height:125px;resize:vertical}label{display:block;margin-bottom:7px;color:#b7c8dd;font-size:13px}.stack{display:grid;gap:12px}.footer{margin-top:30px;font-size:12px;color:#8fa4c0}.menu{display:none}@media(max-width:850px){.shell{display:block}.side{padding:12px;border-right:0;border-bottom:1px solid #30405a}.logo{margin:4px 2px 12px;font-size:20px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:10px 11px}.main{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}.split,.two,.three{grid-template-columns:1fr}.head h1{font-size:22px}}@media(max-width:400px){.stats{grid-template-columns:1fr 1fr}.stat strong{font-size:24px}.card{padding:13px}}
</style></head><body><div class="shell"><aside class="side"><div class="logo">SUPER <span>BDC</span></div><nav class="nav" id="nav"></nav><p class="muted small" style="margin:32px 12px">DEMO MODE<br>DealerSocket disconnected<br>No real communications</p></aside><main class="main"><header class="head"><div><h1 id="title">Command Center</h1><p class="muted" style="margin:6px 0">Vic Garrett Motors • Prototype workspace</p></div><span class="pill safe">● MOCK DATA ONLY</span></header><div id="app"></div><div class="footer">Super BDC v0.1 • All records are fictional • Outbound communications and live CRM sync are disabled</div></main></div><script type="module">
import {generateDraft, classify, checkOutbound, dealerSocketAdapter, mockLeads} from './super-bdc.js';
const VIEWS=[['dashboard','▦ Dashboard'],['leads','♧ Lead Queue'],['inbox','▤ Messaging'],['appointments','▣ Appointments'],['ai','✦ AI Sales Brain'],['controls','⚙ Controls'],['analytics','▥ Analytics']];
const storeKey='super-bdc-demo-v1';
const fresh=()=>({leads:structuredClone(mockLeads),appointments:[],audit:[],drafts:{},mode:'approval',dailyLimit:50});
let state;try{state=JSON.parse(localStorage.getItem(storeKey))||fresh();if(!Array.isArray(state.leads))state=fresh()}catch{state=fresh()}
let view='dashboard',selected=state.leads[0].id,filter='all',q='';
const el=id=>document.getElementById(id); const save=()=>localStorage.setItem(storeKey,JSON.stringify(state));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lead=()=>state.leads.find(x=>x.id===selected)||state.leads[0];
const log=(type,detail)=>{state.audit.unshift({at:new Date().toISOString(),type,detail});state.audit=state.audit.slice(0,150);save()};
const status=x=>classify(x);
const badge=(t,style='')=>'<span class="pill '+style+'">'+esc(t)+'</span>';
const renderNav=()=>{el('nav').innerHTML=VIEWS.map(([key,name])=>'<button data-nav="'+key+'" class="'+(view===key?'active':'')+'">'+name+'</button>').join('')};
const leadRow=x=>'<button class="lead '+(x.id===selected?'selected':'')+'" data-lead="'+x.id+'"><span><b>'+esc(x.name)+'</b><br><span class="muted small">'+esc(x.vehicle)+'</span></span><span>'+badge(status(x),status(x)==='Hot'?'safe':'')+'</span></button>';
const filtered=()=>state.leads.filter(x=>(filter==='all'||status(x).toLowerCase()===filter)&&(x.name+' '+x.vehicle+' '+x.id).toLowerCase().includes(q.toLowerCase()));
const stats=()=>{const appointments=state.appointments.filter(x=>x.status==='confirmed').length;return '<div class="grid stats">'+[['Leads in demo',state.leads.length],['Hot leads',state.leads.filter(x=>status(x)==='Hot').length],['Appointments',appointments],['Drafts prepared',Object.keys(state.drafts).length]].map(([a,b])=>'<div class="card stat"><span class="muted small">'+a+'</span><strong>'+b+'</strong></div>').join('')+'</div>'};
const dashboard=()=>stats()+'<div class="grid two" style="margin-top:16px"><section class="card"><h3 class="section-title">Priority lead queue</h3><div class="list">'+[...state.leads].sort((a,b)=>['Hot','Warm','Cold','Do Not Contact'].indexOf(status(a))-['Hot','Warm','Cold','Do Not Contact'].indexOf(status(b))).slice(0,5).map(leadRow).join('')+'</div></section><section class="card"><h3 class="section-title">Safety status</h3><p>'+badge('DealerSocket OFFLINE','safe')+' '+badge('Outbound SEND DISABLED','warn')+'</p><p class="muted">This demonstration never transmits a text, email, or customer record to a third party.</p><div class="note">Daily processing goal: '+esc(state.dailyLimit)+' leads. Review customer history and consent before drafting. Any real integration requires dealership permission and approved access.</div><h3>Recent activity</h3>'+ (state.audit.length?state.audit.slice(0,5).map(x=>'<p class="small">'+esc(x.type)+' • '+esc(x.detail)+'</p>').join(''):'<p class="muted">No demo actions yet.</p>')+'</section></div>';
const leadList=()=>'<div class="toolbar"><input id="search" class="field grow" placeholder="Search mock leads" value="'+esc(q)+'"><select id="filter" class="field">'+['all','hot','warm','cold','do not contact'].map(x=>'<option '+(filter===x?'selected':'')+' value="'+x+'">'+x+'</option>').join('')+'</select></div><div class="split"><div class="card"><h3 class="section-title">Lead queue ('+filtered().length+')</h3><div class="list">'+filtered().map(leadRow).join('')+'</div></div>'+leadDetail()+'</div>';
const leadDetail=()=>{const x=lead();return '<section class="card"><div class="row"><h3 class="grow">'+esc(x.name)+'</h3>'+badge(status(x),x.optOut?'warn':'safe')+'</div><p class="muted">'+esc(x.id)+' • '+esc(x.source)+' • '+esc(x.vehicle)+'</p><p><b>Interest:</b> '+esc(x.intent)+'</p><p><b>Consent:</b> '+(x.optOut?'DO NOT CONTACT':x.consent?'Mock consent marked':'Not verified')+'</p><p><b>Last message:</b> '+esc(x.messages.at(-1)?.text||'None')+'</p><label>CRM note (local demo only)</label><textarea id="lead-note" class="field" style="min-height:85px">'+esc(x.note||'')+'</textarea><div class="toolbar" style="margin-top:12px"><button class="btn secondary" data-action="save-note">Save demo note</button><button class="btn" data-action="open-inbox">Open conversation</button></div></section>'};
const inbox=()=>'<div class="split"><section class="card"><h3 class="section-title">Conversations</h3><div class="list">'+state.leads.map(leadRow).join('')+'</div></section><section class="card"><div class="row"><h3 class="grow">'+esc(lead().name)+'</h3>'+badge(lead().channel.toUpperCase())+'</div><div class="history">'+lead().messages.map(m=>'<div class="bubble '+(m.from==='dealer'?'out':'')+'"><i>'+esc(m.from==='dealer'?'Dealership':'Customer')+' • '+esc(m.at)+'</i>'+esc(m.text)+'</div>').join('')+'</div><p class="muted small">Drafting uses deterministic mock rules, not a live AI API.</p><div class="toolbar"><select class="field" id="channel"><option value="sms">Text</option><option value="email">Email</option></select><button class="btn" data-action="generate">Generate draft</button></div><label>Editable draft — local only</label><textarea id="draft" class="field" placeholder="Generate a suggested reply...">'+esc(state.drafts[lead().id]||'')+'</textarea><div class="toolbar" style="margin-top:12px"><button class="btn secondary" data-action="save-draft">Save draft</button><button class="btn" disabled title="Live sending intentionally disabled">Send (disabled)</button></div><div class="note">'+esc(checkOutbound(lead()).reason)+'</div></section></div>';
const appointments=()=>'<div class="grid two"><section class="card"><h3>Schedule mock appointment</h3><p class="muted small">Demo-only calendar. Availability is not synced to DealerSocket.</p><div class="stack"><div><label>Customer</label><select id="appt-lead" class="field" style="width:100%">'+state.leads.filter(x=>!x.optOut).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></div><div><label>Date / time (America/Chicago)</label><input id="appt-time" type="datetime-local" class="field" style="width:100%"></div><button class="btn" data-action="add-appt">Create DEMO appointment</button></div></section><section class="card"><h3>Upcoming demo appointments</h3>'+(state.appointments.length?state.appointments.map(x=>'<div class="lead" style="margin-bottom:8px"><span><b>'+esc(state.leads.find(y=>y.id===x.leadId)?.name||'Unknown')+'</b><br><span class="muted small">'+esc(x.at)+' • '+esc(x.status)+'</span></span><button class="btn secondary" data-cancel="'+esc(x.id)+'">Cancel</button></div>').join(''):'<div class="empty">No appointments created</div>')+'</section></div>';
const ai=()=>'<div class="grid two"><section class="card"><h3>Sales reasoning rules</h3><p class="muted">NEPQ-style discovery (Jeremy Miner), calibrated questions (Chris Voss), appointment focus (Joe Verde), concise relevant prospecting (Jeb Blount), confident objection handling (Macklin Twins), disciplined respectful follow-up (Grant Cardone).</p><div class="note">Answer the question first. Ask one question at a time. Never invent terms or approval. No artificial urgency. No manipulative claims.</div><h3>Draft preview</h3><select id="ai-lead" class="field" style="width:100%">'+state.leads.map(x=>'<option value="'+x.id+'" '+(x.id===selected?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select><p><button class="btn" data-action="ai-preview">Preview response</button></p><div id="ai-output" class="note">Choose a lead and preview the proposed next reply.</div></section><section class="card"><h3>DealerSocket adapter</h3><p>'+badge('DISABLED','warn')+'</p><p class="muted">Adapter contract includes listLeads, getConversation, createNote, createAppointment, and sendMessage. Every operation fails closed until an approved integration is configured.</p><pre style="white-space:pre-wrap;color:#a9c9e8">'+esc(JSON.stringify(dealerSocketAdapter.capabilities(),null,2))+'</pre></section></div>';
const controls=()=>'<div class="grid two"><section class="card"><h3>Automation governance</h3><label>Review mode</label><select class="field" id="mode"><option value="approval">Human approval required</option><option value="draft">Draft-only</option></select><p class="muted small">Demo never sends regardless of selection.</p><label>Daily lead limit</label><input class="field" id="limit" type="number" min="1" max="50" value="'+esc(state.dailyLimit)+'"><p><button class="btn secondary" data-action="save-controls">Save settings</button></p><div class="note">Send SMS/email: HARD DISABLED. CRM writes: HARD DISABLED. Live lead import: HARD DISABLED.</div></section><section class="card"><h3>Audit log</h3><button class="btn secondary" data-action="reset">Reset local mock data</button><div class="list" style="margin-top:15px">'+(state.audit.length?state.audit.slice(0,30).map(x=>'<div class="small">'+esc(x.at)+' · '+esc(x.type)+' · '+esc(x.detail)+'</div>').join(''):'<p class="muted">No actions yet.</p>')+'</div></section></div>';
const analytics=()=>'<div class="grid stats">'+[['Lead target/day',state.dailyLimit],['Mock lead records',state.leads.length],['Mock confirmed appointments',state.appointments.filter(x=>x.status==='confirmed').length],['Messages sent',0]].map(([a,b])=>'<section class="card stat"><span class="muted small">'+a+'</span><strong>'+b+'</strong></section>').join('')+'</div><section class="card" style="margin-top:16px"><h3>Measurement framework</h3><table class="table"><tr><th>Metric</th><th>Definition</th></tr>'+[['First-response time','Minutes between inquiry and first authorized response'],['Reply rate','Customers replying / eligible contacted leads'],['Appointment set rate','Confirmed appointments / eligible conversations'],['Show rate','Showed appointments / scheduled appointments'],['Sale conversion','Sales / customers who showed'],['AI cost per conversation','Actual AI cost / completed conversations']].map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td></tr>').join('')+'</table><p class="muted">Live metrics intentionally unavailable until a properly authorized integration is established.</p></section>';
function render(){renderNav();el('title').textContent=({dashboard:'Command Center',leads:'Lead Queue',inbox:'Messaging Center',appointments:'Appointment Manager',ai:'AI Sales Brain',controls:'Safety Controls',analytics:'Performance Analytics'})[view];el('app').innerHTML=({dashboard,leads:leadList,inbox,appointments,ai,controls,analytics})[view]();if(view==='controls')el('mode').value=state.mode}
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){view=n.dataset.nav;render();return}const l=e.target.closest('[data-lead]');if(l){selected=l.dataset.lead;render();return}const c=e.target.closest('[data-cancel]');if(c){const a=state.appointments.find(x=>x.id===c.dataset.cancel);if(a){a.status='canceled';log('appointment','Canceled mock appointment '+a.id);render()}return}const a=e.target.closest('[data-action]');if(!a)return;const act=a.dataset.action,x=lead();if(act==='open-inbox'){view='inbox';render()}if(act==='save-note'){x.note=el('lead-note').value;log('note','Saved mock note for '+x.id);render()}if(act==='generate'){const channel=el('channel').value;state.drafts[x.id]=generateDraft(x,channel);log('draft','Generated '+channel+' draft for '+x.id);render()}if(act==='save-draft'){state.drafts[x.id]=el('draft').value;log('draft','Saved mock draft for '+x.id);render()}if(act==='ai-preview'){selected=el('ai-lead').value;el('ai-output').textContent=generateDraft(lead(),'sms')}if(act==='save-controls'){state.mode=el('mode').value;state.dailyLimit=Math.min(50,Math.max(1,Number(el('limit').value)||50));log('settings','Updated demo controls');render()}if(act==='reset'){if(confirm('Reset all local DEMO data?')){state=fresh();selected=state.leads[0].id;save();render()}}if(act==='add-appt'){const leadId=el('appt-lead').value,at=el('appt-time').value;if(!at){alert('Select a date and time.');return}const d=new Date(at),now=new Date();if(!(d>now)){alert('Choose a future appointment time.');return}const day=d.getDay(),h=d.getHours()+d.getMinutes()/60;if(day===0||day===6&&(h<9.5||h>14.5)||day>=1&&day<=5&&(h<9||h>17.5)){alert('Outside proposed appointment hours. Weekdays: 9:00–5:30; Saturday: 9:30–2:30.');return}if(state.appointments.some(a=>a.leadId===leadId&&a.at===at&&a.status==='confirmed')){alert('Duplicate appointment.');return}const id='DEMO-'+Date.now();state.appointments.push({id,leadId,at,status:'confirmed'});log('appointment','Created mock appointment '+id);render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){q=e.target.value;const pos=e.target.selectionStart;render();const s=el('search');s.focus();s.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}});
render();
</script></body></html>
